<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Anchor Cite</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #dfe3ea;
    --accent: #0f6e78; --accent-soft: #e3f2f3;
    --ok: #1f8a4c; --warn: #c27c0e; --bad: #c63b3b; --page: #3b6fc6; --wait: #98a2b3;
    --hl-main: rgba(255, 200, 0, 0.45); --hl-ctx: rgba(255, 225, 120, 0.22);
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); display: flex; flex-direction: column; font-size: 14px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }

  /* Header */
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2px; color: var(--accent); white-space: nowrap; }
  .doc-title { font-weight: 600; color: var(--ink); max-width: 32vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  #sources { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; background: #fafbfc; cursor: pointer; max-width: 360px; }
  .chip:hover { border-color: var(--accent); }
  .chip .sid { font-weight: 700; }
  .chip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--wait); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.page { background: var(--page); }
  #counts { display: flex; gap: 10px; color: var(--muted); white-space: nowrap; }
  #counts span { display: inline-flex; align-items: center; gap: 4px; }

  /* Split */
  #split { flex: 1; display: flex; min-height: 0; }
  #left { width: 42%; min-width: 260px; display: flex; flex-direction: column; background: var(--panel); }
  #divider { width: 6px; cursor: col-resize; background: var(--line); flex: none; }
  #divider:hover, #divider.drag { background: var(--accent); }
  #right { flex: 1; min-width: 300px; display: flex; flex-direction: column; min-height: 0; }

  /* Summary */
  #summary { flex: 1; overflow: auto; padding: 22px 30px 60px; line-height: 1.6; font-size: 15px; }
  #summary h1 { font-size: 1.5em; margin: .2em 0 .6em; } #summary h2 { font-size: 1.22em; margin: 1.4em 0 .5em; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  #summary h3 { font-size: 1.07em; margin: 1.2em 0 .4em; }
  #summary code { font-family: var(--mono); background: #f1f3f6; padding: 1px 4px; border-radius: 4px; font-size: .9em; }
  #summary pre { background: #f1f3f6; padding: 10px 12px; border-radius: 6px; overflow: auto; }
  #summary pre code { background: none; padding: 0; }
  #summary blockquote { margin: .8em 0; padding: .2em 1em; border-left: 3px solid var(--line); color: var(--muted); }
  #summary table { border-collapse: collapse; margin: .8em 0; font-size: .93em; }
  #summary th, #summary td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
  #summary th { background: #f6f7f9; }
  #summary hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
  a.cite { color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--wait); cursor: pointer; border-radius: 3px; }
  a.cite:hover { background: var(--accent-soft); }
  a.cite.ok { text-decoration-color: var(--ok); } a.cite.warn { text-decoration-color: var(--warn); }
  a.cite.bad { text-decoration-color: var(--bad); text-decoration-style: wavy; } a.cite.page { text-decoration-color: var(--page); }
  a.cite.active { background: #fff3c4; }
  sup.cref { font-size: .68em; color: var(--muted); margin-left: 1px; cursor: pointer; border-radius: 3px; padding: 0 2px; }
  sup.cref:hover { color: var(--accent); background: var(--accent-soft); }
  a.cite.flash, .cite-table tr.flash td { animation: flashbg 1.6s ease-out 1; }
  @keyframes flashbg { 0% { background: #ffe27a; } 100% { background: transparent; } }
  #tip { position: fixed; z-index: 80; max-width: 440px; background: #1d2330; color: #fff; font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 7px; box-shadow: 0 4px 16px rgba(0,0,0,.25); pointer-events: none; display: none; }
  #tip b { color: #ffd86b; font-weight: 600; } #tip .st { display: flex; gap: 6px; align-items: center; margin-top: 4px; color: #d6dae2; }

  /* Citation table */
  .cite-table { width: 100%; }
  .cite-table td.anch { color: var(--muted); }
  .cite-wrap { overflow-x: auto; }
  .cite-table tr { cursor: pointer; } .cite-table tbody tr:hover td { background: var(--accent-soft); }
  .cite-table tr.sel td { background: #fff3c4; }
  .cite-table .totext { border: 0; background: none; padding: 0 2px; color: var(--accent); font-size: 13px; }
  .cite-table td.msg { font-size: .9em; }

  /* Welcome */
  .welcome { max-width: 560px; margin: 8vh auto; text-align: center; color: var(--muted); }
  .welcome h2 { color: var(--ink); border: 0 !important; }
  .welcome .big { font-size: 15px; line-height: 1.7; }
  .welcome button { margin: 6px; }

  /* PDF side */
  #pdfbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #tabs { display: flex; gap: 4px; }
  .tab { padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fafbfc; cursor: pointer; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #pageinfo { color: var(--muted); min-width: 70px; }
  #nav { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #fffbea; border-bottom: 1px solid #f0e2a8; font-size: 13px; }
  #nav.hidden { display: none; }
  #nav .msg { flex: 1; }
  #nav.bad { background: #fdeeee; border-color: #f2c6c6; } #nav.ok { background: #ecf8f1; border-color: #c4e8d2; }
  #nav.page { background: #edf3fd; border-color: #c9daf5; }
  #viewers { flex: 1; position: relative; min-height: 0; }
  .viewer { position: absolute; inset: 0; overflow: auto; background: #8a919c; padding: 16px 0 40px; }
  .viewer.hidden { display: none; }
  .pg { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pg .num { position: absolute; left: -2px; top: -1px; transform: translateX(-100%); color: #f3f4f6; font-size: 11px; padding-right: 6px; }
  .hl { position: absolute; inset: 0; pointer-events: none; }
  .hl div { position: absolute; border-radius: 2px; mix-blend-mode: multiply; }
  .hl .ctx { background: var(--hl-ctx); }
  .hl .main { background: var(--hl-main); }
  .hl .main.flash { animation: flash 1.4s ease-out 1; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px rgba(255,170,0,.65); } 100% { box-shadow: 0 0 0 0 rgba(255,170,0,0); } }
  .empty-pdf { color: #f3f4f6; text-align: center; margin-top: 15vh; font-size: 15px; line-height: 1.8; }

  #drop { position: fixed; inset: 0; background: rgba(15,110,120,.18); border: 4px dashed var(--accent); display: none; align-items: center; justify-content: center; z-index: 50; font-size: 22px; color: var(--accent); font-weight: 600; }
  #drop.show { display: flex; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60; max-width: 80vw; }
  #toast.show { opacity: .95; }
  #progress { color: var(--muted); font-size: 12px; }

  /* Modal */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 70; }
  #modal.show { display: flex; }
  #modal .box { background: var(--panel); border-radius: 10px; width: min(760px, 92vw); max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #modal .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #modal .head b { flex: 1; }
  #modal .body { padding: 12px 16px; overflow: auto; }
  #modal input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin-bottom: 8px; }
  #modal .item { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 10px; }
  #modal .item:hover { background: var(--accent-soft); }
  #modal .item small { color: var(--muted); margin-left: auto; white-space: nowrap; }
  #modal textarea { width: 100%; height: 50vh; font-family: var(--mono); font-size: 12px; }

  /* Phones and narrow windows: one pane at a time */
  #viewSwitch, #backToText { display: none; }
  @media (max-width: 820px) {
    header { gap: 6px; padding: 6px 8px; }
    .brand, #counts, #btnReport, #progress:empty { display: none; }
    .doc-title { max-width: 100%; flex-basis: 100%; order: -1; }
    #sources .chip { max-width: 60vw; }
    #viewSwitch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    #viewSwitch button { border: 0; border-radius: 0; padding: 5px 12px; }
    #viewSwitch button.on { background: var(--accent); color: #fff; }
    #divider { display: none; }
    #left { width: 100% !important; min-width: 0; }
    #right { min-width: 0; display: none; }
    body.m-pdf #left { display: none; } body.m-pdf #right { display: flex; }
    #backToText { display: inline-block; }
    #summary { padding: 14px 14px 60px; font-size: 15.5px; }
    .viewer { padding: 8px 0 30px; }
    .pg .num { display: none; }
    #nav { font-size: 12.5px; flex-wrap: wrap; }
    #pageinfo { min-width: 0; font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">PDF Anchor Cite</span>
  <span id="viewSwitch"><button id="vsText" class="on">Summary</button><button id="vsPdf">PDF</button></span>
  <span class="doc-title" id="docTitle"></span>
  <button id="btnOpenMd" class="primary" title="Open a summary (.md or .txt)">Open summary</button>
  <button id="btnOpenPdf" title="Open one or more PDFs">Open PDF</button>
  <button id="btnLibrary" style="display:none" title="Browse summaries in your library folder">Library</button>
  <div id="sources"></div>
  <span class="spacer"></span>
  <span id="progress"></span>
  <div id="counts"></div>
  <button id="btnReport" title="Copy a text report of every citation's status (handy to paste back to an AI)" disabled>Copy report</button>
</header>

<main id="split">
  <section id="left"><div id="summary"></div></section>
  <div id="divider" title="Drag to resize"></div>
  <section id="right">
    <div id="pdfbar">
      <button id="backToText" title="Back to the summary">‹ Summary</button>
      <div id="tabs"></div>
      <span class="spacer"></span>
      <span id="pageinfo"></span>
      <button id="zOut" title="Zoom out">−</button>
      <button id="zFit" title="Fit width">Fit</button>
      <button id="zIn" title="Zoom in">+</button>
    </div>
    <div id="nav" class="hidden">
      <span class="dot" id="navDot"></span><span class="msg" id="navMsg"></span>
      <button id="navPrev" title="Previous match">‹</button>
      <button id="navNext" title="Next match">›</button>
      <button id="navClear" title="Clear highlight (Esc)">✕</button>
    </div>
    <div id="viewers"><div class="viewer" id="emptyViewer"><div class="empty-pdf">No PDF loaded.<br>Drop the PDF here, or click a source chip at the top.</div></div></div>
  </section>
</main>

<input type="file" id="mdInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<input type="file" id="pdfInput" accept=".pdf,application/pdf" multiple hidden>
<div id="drop">Drop a summary (.md / .txt) or PDF files</div>
<div id="toast"></div>
<div id="tip"></div>
<div id="modal"><div class="box"><div class="head"><b id="modalTitle"></b><button id="modalClose">Close</button></div><div class="body" id="modalBody"></div></div></div>

<script src="vendor/pdfjs-bundle.js"></script>
<script>
"use strict";
/* =====================================================================
   PDF Anchor Cite  v1.1.0  (2026-11-24)
   Summary with anchor-word citations  ->  jump + highlight in the PDF.
   The matching rules below (CORE) are mirrored in check_citations.py.
   ===================================================================== */
const APP_VERSION = "1.1.0";

/* ----------------------------- CORE ---------------------------------- */
// CORE-START
const CORE = (() => {
  const DEFAULT_SPAN = 80;           // words from first to last anchor for a normal match
  const FAR_FACTOR = 3;              // up to 3x on the stated page = "spread out" (amber), beyond = red
  const WIDE_RANGE = 3;              // page ranges longer than this are flagged
  const SAME_TEXT_MIN = 6;           // identical repeated passages of >= this many words count as one
  const HEAD_LINES = 4, FOOT_LINES = 5;
  const MAX_OCC = 5000;              // safety cap per anchor
  const RE_ALNUM = /[\p{L}\p{N}]/u, RE_NUM = /\p{N}/u;
  const normCache = new Map();
  // Old LaTeX fonts without a Unicode map put ligatures in control codes (ff fi fl ffi ffl).
  const LIG = { "\x1b": "ff", "\x1c": "fi", "\x1d": "fl", "\x1e": "ffi", "\x1f": "ffl" };
  function normChar(ch) {
    let v = normCache.get(ch);
    if (v === undefined && LIG[ch]) { v = LIG[ch]; normCache.set(ch, v); }
    if (v === undefined) {
      v = "";
      for (const c of ch.normalize("NFKD").toLowerCase()) if (RE_ALNUM.test(c)) v += c;
      normCache.set(ch, v);
    }
    return v;
  }
  function normAnchor(s) { let o = ""; for (const ch of s) o += normChar(ch); return o; }

  // pages: array of raw page strings (index 0 = PDF page 1)
  function buildStream(pages) {
    const chars = [], isStart = [], page = [], raw = [];
    let sep = true, lastKind = "";
    pages.forEach((txt, p) => {
      sep = true;
      let r = 0;
      for (const ch of txt) {           // iterate code points
        const n = normChar(ch);
        if (!n) { sep = true; r += ch.length; continue; }
        for (const c of n) {
          const kind = RE_NUM.test(c) ? "N" : "L";
          isStart.push(sep || kind !== lastKind ? 1 : 0);
          chars.push(c); page.push(p); raw.push(r);
          sep = false; lastKind = kind;
        }
        r += ch.length;
      }
    });
    const N = chars.length, isEnd = new Uint8Array(N), wordIdx = new Int32Array(N);
    let w = 0;
    for (let i = 0; i < N; i++) {
      if (isStart[i]) w++;
      wordIdx[i] = w;
      if (i + 1 >= N || isStart[i + 1]) isEnd[i] = 1;
    }
    return { text: chars.join(""), isStart: Uint8Array.from(isStart), isEnd, wordIdx, page: Int32Array.from(page), raw: Int32Array.from(raw), numPages: pages.length };
  }

  function occurrences(st, a) {
    const out = [];
    if (!a) return out;
    let i = st.text.indexOf(a);
    while (i !== -1 && out.length < MAX_OCC) {
      const e = i + a.length - 1;
      if (st.isStart[i] && st.isEnd[e]) out.push({ s: i, e });
      i = st.text.indexOf(a, i + 1);
    }
    return out;
  }
  function firstAfter(list, pos) {
    let lo = 0, hi = list.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (list[m].s > pos) hi = m; else lo = m + 1; }
    return lo < list.length ? list[lo] : null;
  }
  function orderedWindows(occ) {
    const out = [];
    for (const o1 of occ[0]) {
      let cur = o1.e, ok = true; const parts = [o1];
      for (let j = 1; j < occ.length; j++) {
        const nx = firstAfter(occ[j], cur);
        if (!nx) { ok = false; break; }
        parts.push(nx); cur = nx.e;
      }
      if (!ok) break;
      out.push({ s: o1.s, e: cur, parts, ordered: true });
    }
    const byE = new Map();
    for (const w of out) { const p = byE.get(w.e); if (!p || w.s > p.s) byE.set(w.e, w); }
    return [...byE.values()].sort((a, b) => a.s - b.s);
  }
  function unorderedWindows(occ) {
    const k = occ.length, all = [];
    occ.forEach((L, j) => L.forEach(o => all.push({ s: o.s, e: o.e, j })));
    all.sort((a, b) => a.s - b.s || a.e - b.e);
    const cnt = new Array(k).fill(0); let have = 0, l = 0; const out = []; const seenL = new Set();
    for (let r = 0; r < all.length; r++) {
      if (cnt[all[r].j]++ === 0) have++;
      while (l < r && cnt[all[l].j] > 1) { cnt[all[l].j]--; l++; }
      if (have === k && !seenL.has(l)) {
        seenL.add(l);
        let e = 0; for (let t = l; t <= r; t++) e = Math.max(e, all[t].e);
        out.push({ s: all[l].s, e, parts: all.slice(l, r + 1), ordered: false });
      }
    }
    return out;
  }
  const span = (st, w) => st.wordIdx[w.e] - st.wordIdx[w.s] + 1;

  // page field: "7", "p7", "p. 7", "34-35", "?" or ""
  function parsePages(field) {
    const f = String(field || "").trim();
    if (!f || f === "?") return null;
    const m = f.match(/^(?:pp?\.?\s*)?(\d+)(?:\s*[-–]\s*(\d+))?$/i);
    if (!m) return undefined;
    const a = +m[1], b = m[2] ? +m[2] : a;
    return [Math.min(a, b), Math.max(a, b)];
  }
  function parseAnchors(field) {
    return String(field || "").split(/\s*(?:\.\.\.|…)\s*/).map(s => s.trim()).filter(Boolean);
  }
  function parseOptions(field) {
    const o = { nth: null, span: DEFAULT_SPAN };
    for (const t of String(field || "").split(/[\s,;]+/).filter(Boolean)) {
      let m;
      if ((m = t.match(/^#(\d+)$/))) o.nth = +m[1];
      else if ((m = t.match(/^span=(\d+)$/i))) o.span = Math.max(1, +m[1]);
    }
    return o;
  }

  /* Running headers/footers: lines near the top or bottom of a page that repeat on other pages
     (digits ignored) are blanked with spaces, so they don't count as words between anchors.
     Positions stay the same, so highlights are unaffected. */
  function blankBoilerplate(pages) {
    const key = l => l.split(/\s+/).filter(Boolean).join(" ").toLowerCase().replace(/\d+/g, "#");
    const zone = txt => {
      const lines = txt.split("\n"), idx = [];
      lines.forEach((l, i) => { if (l.trim()) idx.push(i); });
      return [lines, new Set([...idx.slice(0, HEAD_LINES), ...idx.slice(-FOOT_LINES)])];
    };
    const counts = new Map();
    for (const txt of pages) {
      const [lines, z] = zone(txt);
      for (const k of new Set([...z].map(i => key(lines[i])))) counts.set(k, (counts.get(k) || 0) + 1);
    }
    return pages.map(txt => {
      const [lines, z] = zone(txt);
      for (const i of z) { const k = key(lines[i]), n = counts.get(k) || 0; if (n >= 3 || (n >= 2 && k.length >= 25)) lines[i] = " ".repeat(lines[i].length); }
      return lines.join("\n");
    });
  }
  function mergeOverlaps(cands) {
    const out = [];
    for (const c of [...cands].sort((a, b) => a.s - b.s || a.e - b.e)) {
      const last = out[out.length - 1];
      if (last && c.s <= last.e) { if (c.span < last.span) out[out.length - 1] = c; }
      else out.push(c);
    }
    return out;
  }

  /* Grade one citation.  cit = {pages:[a,b]|null|undefined, anchors:[...], opts:{nth,span}}
     Returns {status: ok|warn|bad|page, msg, cands:[{s,e,p1,p2,span,ordered}], pick}
     Same rules as grade() in check_citations.py. */
  function grade(st, cit) {
    const P = cit.pages, opts = cit.opts || { nth: null, span: DEFAULT_SPAN };
    const pageStr = P ? (P[0] === P[1] ? "p" + P[0] : "p" + P[0] + "-" + P[1]) : "whole PDF";
    if (P === undefined) return { status: "bad", msg: "Page field not understood (use e.g. 7 or 34-35)", cands: [] };
    if (P && (P[0] < 1 || P[1] > st.numPages)) return { status: "bad", msg: `Page ${pageStr} is outside the PDF (it has ${st.numPages} pages)`, cands: [] };
    const anchors = cit.anchors.map(normAnchor).filter(Boolean);
    if (!anchors.length) {
      if (cit.anchors.length) return { status: "bad", msg: "Anchors contain no letters or numbers", cands: [] };
      if (!P) return { status: "bad", msg: "No page and no anchors", cands: [] };
      return { status: "page", msg: `Page only (${pageStr}), no anchors to highlight`, cands: [], pageOnly: P[0] };
    }
    const occ = anchors.map(a => occurrences(st, a));
    const missing = cit.anchors.filter(a => normAnchor(a) && !occ[anchors.indexOf(normAnchor(a))].length);
    if (missing.length) return { status: "bad", msg: `Not found anywhere in the PDF: "${missing.join('", "')}"`, cands: [], pageOnly: P && P[0] };

    const spanLim = opts.span, farLim = spanLim * FAR_FACTOR;
    const wide = P && P[1] - P[0] + 1 > WIDE_RANGE;
    const on = c => !P || (c.p1 >= P[0] && c.p2 <= P[1]);

  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext("2d", { alpha: false });
  d._task = page.render({ canvas: c, canvasContext: ctx, viewport: vp });
  try {
    await d._task.promise;
    if (gen === doc.renderGen) { d.insertBefore(c, d.firstChild); d._rendered = true; }
  } catch (e) { /* cancelled */ }
  d._task = null;
}
function updatePageInfo(doc) {
  if (doc !== S.activeDoc) return;
  const y = doc.el.scrollTop + doc.el.clientHeight * 0.3;
  let f = 0; while (f < doc.numPages - 1 && doc.pageEls[f + 1].offsetTop <= y) f++;
  $("pageinfo").textContent = `p ${f + 1} / ${doc.numPages}  ·  ${Math.round(doc.scale * 100)}%`;
}
function showDoc(doc) {
  if (!doc) return;
  for (const d of S.pool) if (d.el) d.el.classList.toggle("hidden", d !== doc);
  $("emptyViewer").classList.add("hidden");
  S.activeDoc = doc;
  if (doc.fit && Math.abs(fitScale(doc) - doc.scale) > 0.01) layout(doc); else scheduleRender(doc);
  renderTabs();
}
function zoom(f) {
  const doc = S.activeDoc; if (!doc) return;
  const el = doc.el, rel = el.scrollTop / Math.max(1, el.scrollHeight);

}

/* ---------------------------- ASSIGNMENT ------------------------------ */
function sourcesList() { return S.summary ? [...S.summary.sources.values()] : []; }
function docFor(id) { return S.assign.get(id) || null; }
function autoAssign() {
  const srcs = sourcesList();
  for (const s of srcs) {
    if (S.assign.has(s.id) || !s.filename) continue;
    const d = S.pool.find(d => d.name.toLowerCase() === s.filename.toLowerCase());
    if (d) S.assign.set(s.id, d);
  }
  const freeSrc = srcs.filter(s => !S.assign.has(s.id));
  const used = new Set(S.assign.values());
  const freeDocs = S.pool.filter(d => !used.has(d));
  if (freeSrc.length === 1 && freeDocs.length === 1 && !freeSrc[0].filename) S.assign.set(freeSrc[0].id, freeDocs[0]);
}
async function addPdfFile(file, forSource) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    await addPdfData(file.name, buf, forSource);
  } catch (e) { console.error(e); toast(`Could not open ${file.name}: ${e.message}`, 5000); $("progress").textContent = ""; }
}
async function addPdfData(name, buf, forSource) {
  let doc = S.pool.find(d => d.name === name && d.numPages);
  if (!doc) { doc = await openPdf(name, buf); S.pool.push(doc); buildViewer(doc); }
  if (forSource) S.assign.set(forSource, doc);
  else if (S.summary) {
    autoAssign();
    if (![...S.assign.values()].includes(doc)) {
      const free = sourcesList().find(s => !S.assign.has(s.id));
      if (free) { S.assign.set(free.id, doc); toast(`${name} assigned to source ${free.id} (expected ${free.filename || "any PDF"})`, 4500); }
    }
  }
  regrade();
  if (!S.activeDoc) showDoc(doc); else renderTabs();
}

/* ---------------------------- SUMMARY LOADING ------------------------ */
function loadSummaryText(name, text) {
  S.summary = parseSummary(text); S.summaryName = name;
  clearHighlights(S.activeDoc); S.assign = new Map(); S.current = null; hideNav();
  $("docTitle").textContent = S.summary.title || name;
  document.title = (S.summary.title || name) + " · PDF Anchor Cite";
  $("summary").innerHTML = renderMarkdown(S.summary.body);
  $("summary").scrollTop = 0;
  autoAssign();
  regrade();
  if (S.summary.dupes.length) toast(`Duplicate citation ids: ${S.summary.dupes.join(", ")} (the last one wins)`, 5000);
  if (!S.summary.citations.size) toast("No citation lines found. See the README for the format.", 5000);
  if (S.served) autoLoadFromLibrary();
  const first = sourcesList().map(s => docFor(s.id)).find(Boolean);
  if (first) showDoc(first);
}
async function loadSummaryFile(file) { loadSummaryText(file.name, await file.text()); }

/* ---------------------------- GRADING + UI --------------------------- */
function regrade() {
  S.results = new Map();
  if (!S.summary) { renderSources(); return; }
  for (const c of S.summary.citations.values()) {
    const doc = docFor(c.source);
    if (!doc) { S.results.set(c.id, { status: "wait", msg: `Waiting for source ${c.source}`, cands: [] }); continue; }
    S.results.set(c.id, CORE.grade(doc.stream, c));
  }
  // links that point at missing ids
  document.querySelectorAll("#summary a.cite").forEach(a => {
    const id = a.dataset.cite, r = S.results.get(id), c = S.summary.citations.get(id);
    a.className = "cite " + (r ? r.status : "bad") + (S.current && S.current.id === id ? " active" : "");
    a.removeAttribute("title");
  });
  renderCiteTable(); renderSources(); renderCounts();
  $("btnReport").disabled = !S.summary.citations.size;
}
function renderCiteTable() {
  const host = $("citeTable"); if (!host) return;
  const rows = [...S.summary.citations.values()].map(c => {
    const r = S.results.get(c.id) || { status: "wait", msg: "" };
    return `<tr data-row="${esc(c.id)}" title="Click: show in the PDF. Click again: back to the text."><td><span class="dot ${r.status}"></span></td><td><b>${esc(c.id)}</b><button class="totext" data-totext="${esc(c.id)}" title="Back to the text">↑</button></td><td>${esc(c.source)}</td><td>${esc(c.pageField)}</td><td class="anch">${esc(c.anchorText)}${c.optText ? " <code>" + esc(c.optText) + "</code>" : ""}</td><td class="msg">${esc(r.msg)}</td></tr>`;
  }).join("");
  host.innerHTML = `<div class="cite-wrap"><table class="cite-table"><thead><tr><th></th><th>id</th><th>Src</th><th>Page</th><th>Anchors</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderSources() {
  const box = $("sources"); box.innerHTML = "";
  for (const s of sourcesList()) {
    const d = docFor(s.id);
    let cls = "wait", tip = `Source ${s.id}: click to load ${s.filename || "its PDF"}`, label = s.filename || "(no filename given)";
    if (d) {
      const nameOk = !s.filename || d.name.toLowerCase() === s.filename.toLowerCase();
      const pagesOk = !s.pages || s.pages === d.numPages;
      cls = nameOk && pagesOk ? "ok" : "warn";
      label = d.name;
      tip = `Source ${s.id}: ${d.name}, ${d.numPages} pages` + (nameOk ? "" : `\nExpected ${s.filename}`) + (pagesOk ? "" : `\nExpected ${s.pages} pages`) + "\nClick to show. To load a different file: Shift-click";
    }
    const chip = document.createElement("span");
    chip.className = "chip"; chip.title = tip;
    chip.innerHTML = `<span class="dot ${cls}"></span><span class="sid">${esc(s.id)}</span><span class="fname">${esc(label)}</span>`;
    chip.onclick = e => { if (d && !e.shiftKey) showDoc(d); else pickPdfFor(s.id); };
    chip.oncontextmenu = e => { e.preventDefault(); pickPdfFor(s.id); };
    if (d) chip.title += " (or Shift-click / right-click)";
    box.appendChild(chip);
  }
  renderTabs();
}
function renderTabs() {
  const tabs = $("tabs"); tabs.innerHTML = "";
  const shown = new Set();
  const entries = [];
  for (const s of sourcesList()) { const d = docFor(s.id); if (d && !shown.has(d)) { shown.add(d); entries.push([s.id, d]); } }
  for (const d of S.pool) if (!shown.has(d)) entries.push(["?", d]);
  if (entries.length < 2 && !entries.some(e => e[0] === "?")) { if (S.activeDoc) tabs.innerHTML = `<span style="color:var(--muted)">${esc(S.activeDoc.name)}</span>`; return; }
  for (const [id, d] of entries) {
    const t = document.createElement("span");
    t.className = "tab" + (d === S.activeDoc ? " active" : "");
    t.textContent = id === "?" ? d.name : id; t.title = d.name;

}
function renderCounts() {
  const n = { ok: 0, warn: 0, bad: 0, page: 0, wait: 0 };
  for (const r of S.results.values()) n[r.status]++;
  const lab = { ok: "found", warn: "check", bad: "not found", page: "page only", wait: "waiting for PDF" };
  $("counts").innerHTML = Object.keys(n).filter(k => n[k]).map(k => `<span title="${lab[k]}"><span class="dot ${k}"></span>${n[k]}</span>`).join("");
}
function pickPdfFor(id) { S.pendingSource = id; $("pdfInput").multiple = false; $("pdfInput").click(); }

/* ---------------------------- GO TO CITATION ------------------------- */
function goTo(id, pick) {
  const c = S.summary && S.summary.citations.get(id);
  if (!c) { showNav("bad", `${id}: there is no citation line with this id in the summary`, 0, 0); return; }
  const doc = docFor(c.source);
  document.querySelectorAll("a.cite.active").forEach(a => a.classList.remove("active"));
  document.querySelectorAll(`a.cite[data-cite="${CSS.escape(id)}"]`).forEach(a => a.classList.add("active"));
  if (!doc) {
    const s = S.summary.sources.get(c.source);
    showNav("wait", `${id}: source ${c.source} (${(s && s.filename) || "PDF"}) is not loaded. Choose the file…`, 0, 0);
    pickPdfFor(c.source); return;
  }
  const r = S.results.get(id);
  selectRow(id);
  if (narrow()) setView("pdf");
  showDoc(doc);
  clearHighlights(doc);
  if (!r.cands.length) {
    const p = r.pageOnly || (c.pages && c.pages[0]);
    if (p) scrollToPage(doc, p - 1);
    S.current = { id, r, i: 0 };
    showNav(r.status, `${id} · ${c.source} p${c.pageField} · ${r.msg}`, 0, 0);
    return;
  }
  const i = pick == null ? (r.pick || 0) : ((pick % r.cands.length) + r.cands.length) % r.cands.length;
  S.current = { id, r, i };
  const cand = r.cands[i];
  const boxes = highlightBoxes(doc, cand);
  for (const b of boxes) drawBoxes(doc, b);
  const first = boxes.find(b => b.main.length) || boxes[0];
  scrollToBox(doc, first.page, first.main[0] || { y: 0 });
  const where = r.cands.length > 1 ? `match ${i + 1} of ${r.cands.length}` : "";
  showNav(r.status, `${id} · ${c.source} p${c.pageField} → p${cand.p1}${cand.p2 !== cand.p1 ? "-" + cand.p2 : ""} · ${r.msg}`, i, r.cands.length, where);
}
function drawBoxes(doc, b) {
  const layer = doc.pageEls[b.page].querySelector(".hl");
  const add = (r, cls) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, { left: r.x * 100 + "%", top: r.y * 100 + "%", width: r.w * 100 + "%", height: r.h * 100 + "%" }); layer.appendChild(d); };
  b.ctx.forEach(r => add(r, "ctx"));
  b.main.forEach(r => add(r, "main flash"));
}
function clearHighlights(doc) { if (doc) doc.pageEls.forEach(d => d.querySelector(".hl").innerHTML = ""); }
function scrollToPage(doc, p) { doc.el.scrollTop = doc.pageEls[p].offsetTop - 12; scheduleRender(doc); }
function scrollToBox(doc, p, r) {
  const d = doc.pageEls[p];
  doc.el.scrollTop = Math.max(0, d.offsetTop + r.y * d.offsetHeight - doc.el.clientHeight * 0.3);
  scheduleRender(doc);
}
function showNav(status, msg, i, n, where = "") {
  const nav = $("nav"); nav.className = status;
  $("navDot").className = "dot " + status;
  $("navMsg").textContent = msg + (where ? "  ·  " + where : "");
  $("navPrev").style.display = $("navNext").style.display = n > 1 ? "" : "none";
}
function hideNav() { $("nav").className = "hidden"; }

/* ---------------------------- REPORT --------------------------------- */
function reportText() {
  const lab = { ok: "FOUND", warn: "CHECK", bad: "NOT FOUND", page: "PAGE ONLY", wait: "NO PDF" };
  const lines = [`PDF Anchor Cite report · ${S.summaryName} · ${new Date().toISOString().slice(0, 10)}`];
  for (const s of sourcesList()) { const d = docFor(s.id); lines.push(`Source ${s.id}: ${s.filename || "?"}${d ? ` -> loaded ${d.name} (${d.numPages} pages)` : " -> not loaded"}`); }
  lines.push("");
  for (const c of S.summary.citations.values()) {
    const r = S.results.get(c.id);
    lines.push(`${c.id} | ${c.source} | ${c.pageField} | ${c.anchorText}${c.optText ? " | " + c.optText : ""}  =>  ${lab[r.status]}: ${r.msg}`);
  }
  const used = new Set([...document.querySelectorAll("#summary a.cite")].map(a => a.dataset.cite));
  const orphan = [...used].filter(id => !S.summary.citations.has(id));
  if (orphan.length) lines.push("", "Links with no citation line: " + orphan.join(", "));
  const unused = [...S.summary.citations.keys()].filter(id => !used.has(id));
  if (unused.length) lines.push("Citation lines not linked from the text: " + unused.join(", "));
  return lines.join("\n");
}
async function copyReport() {
  const txt = reportText();
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  if (ok) toast("Report copied to clipboard");
  else openModal("Citation report", `<textarea readonly>${esc(txt)}</textarea>`);
}

/* ---------------------------- MODAL / LIBRARY ------------------------ */
function openModal(title, html) { $("modalTitle").textContent = title; $("modalBody").innerHTML = html; $("modal").classList.add("show"); }
function closeModal() { $("modal").classList.remove("show"); }
async function checkServed() {

}

  let list = [];

    $("libItems").innerHTML = items.length ? items.map(f => `<div class="item" data-url="${esc(f.url)}" data-name="${esc(f.name)}"><span>${esc(f.path)}</span><small>${esc(f.modified)}</small></div>`).join("") : "<p>No .md or .txt files found in the library folder.</p>";

async function autoLoadFromLibrary() {

/* ---------------------------- EVENTS --------------------------------- */
function routeFiles(files) {
  const list = [...files];
  const md = list.find(f => /\.(md|markdown|txt)$/i.test(f.name));
  const pdfs = list.filter(f => /\.pdf$/i.test(f.name) || f.type === "application/pdf");
  (async () => {
    if (md) await loadSummaryFile(md);
    for (const f of pdfs) await addPdfFile(f, pdfs.length === 1 ? S.pendingSource : null);
    S.pendingSource = null;
    if (!md && !pdfs.length) toast("Drop a .md, .txt or .pdf file");
  })();
}

  (async () => { for (const f of fs) await addPdfFile(f, fs.length === 1 ? target : null); if (target && S.current && S.current.id) { const c = S.summary.citations.get(S.current.id); if (c && c.source === target) goTo(S.current.id); } })();
};
$("summary").addEventListener("click", e => {
  const ref = e.target.closest("sup.cref");

function selectRow(id) { document.querySelectorAll(".cite-table tr.sel").forEach(r => r.classList.remove("sel")); const r = document.querySelector(`.cite-table tr[data-row="${CSS.escape(id)}"]`); if (r) r.classList.add("sel"); return r; }
function flash(el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

  if (!links.length) { toast(`Citation ${id} is not linked from the text`); return; }
  textCycle = textCycle.id === id ? { id, i: (textCycle.i + 1) % links.length } : { id, i: 0 };
  const a = links[textCycle.i];

/* hover tooltip: anchors + status */

  const pg = c.pageField ? "p" + c.pageField.replace(/^p\.?\s*/i, "") : "no page";
  const anch = c.anchors.length ? c.anchors.map(a => `<b>${esc(a)}</b>`).join(" … ") : "<i>no anchors (page only)</i>";
  return `${esc(id)} · source ${esc(c.source)} · ${esc(pg)}${c.optText ? " · " + esc(c.optText) : ""}<br>Anchors: ${anch}` +

}
function showTip(el, html) {

}

window.addEventListener("dragenter", e => { if ([...(e.dataTransfer.types || [])].includes("Files")) { dragDepth++; $("drop").classList.add("show"); } });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("show"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").classList.remove("show"); if (e.dataTransfer.files.length) routeFiles(e.dataTransfer.files); });

(() => { // split divider
  const left = $("left"), div = $("divider");
  const saved = recall("split", 42); left.style.width = saved + "%";
  let drag = false;
  div.onmousedown = e => { drag = true; div.classList.add("drag"); e.preventDefault(); };
  window.addEventListener("mousemove", e => { if (!drag) return; const pct = Math.min(75, Math.max(18, e.clientX / window.innerWidth * 100)); left.style.width = pct + "%"; });
  window.addEventListener("mouseup", () => { if (!drag) return; drag = false; div.classList.remove("drag"); store("split", parseFloat(left.style.width)); onResize(); });
})();
let resizeT;
function onResize() { clearTimeout(resizeT); resizeT = setTimeout(() => { for (const d of S.pool) if (d.fit && d.el) layout(d); }, 150); }
window.addEventListener("resize", onResize);

(async () => {
  welcome();
  await checkServed();
  const q = new URLSearchParams(location.search).get("summary");
  if (q && S.served) {
    try { const r = await fetch(q); if (r.ok) loadSummaryText(decodeURIComponent(q.split("/").pop()), await r.text()); else toast("Could not open " + q); } catch (e) {}
  }
  getPdfjs().catch(e => toast(e.message, 8000));
})();
</script>
